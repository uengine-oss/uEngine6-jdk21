# definition-service 로컬 직접 실행용 설정 오버라이드 (브랜치 bmt/sds-process-test 기준)
#
# 사용법:
#   SPRING_PROFILES_ACTIVE=postgres,keycloak-installed \
#   java -jar definition-service/target/definition-service-1.1-SNAPSHOT.jar \
#        --spring.config.additional-location=file:docs/local/definition-service.local.yml
#
# DataSource 와 포트(9293)는 application.yml 의 postgres, keycloak-installed 프로파일이 제공한다.

uengine:
  definition:
    # process-service 와 동일한 값이어야 한다. 다르면 인스턴스 실행 시 정의를 못 찾는다.
    basePath: ${UENGINE_BASEPATH:.}

logging:
  file:
    name: ${UENGINE_LOG_DIR:logs}/bpm-definition.log
